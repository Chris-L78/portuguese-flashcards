<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f1ea;color:#222;-webkit-text-size-adjust:100%}

.bar>button,.bar>select{flex:1 1 0}
input{width:100%}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;font-size:.95rem}
.chip.on{background:#0b6e4f;color:#fff}
.chip .n{opacity:.7;font-size:.8rem;margin-left:4px}
.scope .chip{flex:1 1 30%;font-weight:600}
.scope .chip.weak.on{background:#b3261e;border-color:#b3261e}
details{background:#fff;border:1px solid #ccc;border-radius:10px;margin:8px 0}
summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-size:1rem;cursor:pointer;font-weight:600}
.tp{padding:0 10px 10px;max-height:46vh;overflow:auto}
.tp h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#666;margin:10px 4px 2px}
.tp .bar{margin:4px 0}
.card{position:relative;background:#fff;border-radius:14px;box-shadow:0 2px 8px #0002;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 24px 32px;font-size:1.4rem;cursor:pointer;user-select:none;flex-direction:column;overflow-wrap:anywhere}
.card small{display:block;font-size:.8rem;color:#888;margin-top:10px}
.star{position:absolute;top:4px;right:4px;width:48px;padding:0;font-size:1.5rem;border:0;background:transparent;color:#bbb;line-height:1}
.star.on{color:#d98500;background:transparent;border:0}
.opts button{display:block;width:100%;margin:6px 0;text-align:left;min-height:52px}
.ok{background:#c8f0d0!important}.no{background:#f6c9c9!important}
.judge button{flex:1;font-weight:600;font-size:1.05rem;min-height:56px}
.judge .miss{background:#fbe3e1;border-color:#e0a09a}.judge .got{background:#dff3e3;border-color:#9fcfa8}
#info{color:#555;font-size:.9rem;margin:6px 0;min-height:1.2em}
#sum{font-size:.9rem;color:#0b6e4f;font-weight:600;margin:4px 2px}
.nav button{flex:1;min-height:56px;font-size:1.2rem}
.small{font-size:.85rem;min-height:40px;padding:6px 12px}
.muted{color:#777;font-size:.85rem;margin:4px 2px}
</style></head><body>
